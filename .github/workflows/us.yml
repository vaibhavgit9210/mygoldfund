name: us board

# Twice every trading day, in New York time: the pre market run and the post close run
# (DESIGN.md section 11). The Worker's cron (ledger/wrangler.toml) also dispatches this
# workflow a few minutes later as a belt and braces; us_build.py is idempotent per
# (date, session), so a second firing exits 0 without touching anything.
#
# If the runner ever rejects the `timezone` key on a schedule entry, replace the two entries
# with their UTC equivalents under both EDT and EST (the extra firing is harmless):
#   - cron: "35 12,13 * * 1-5"
#   - cron: "25 20,21 * * 1-5"
on:
  schedule:
    - cron: "35 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "25 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      session:
        description: "which run (auto picks from the New York clock)"
        default: "auto"
        type: choice
        options: [auto, pre, post]
      force:
        description: "redo a session that is already in the ledger"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: us-run
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only, no pip install. The Worker POST is skipped quietly when LEDGER_KEY is unset
      # and never fails the run; the committed ledger is the source of truth.
      - name: Build the US board
        env:
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          LEDGER_URL: https://mygoldfund-ledger.vaibhavpro9210.workers.dev
        run: python3 scripts/us_build.py --session ${{ inputs.session || 'auto' }} ${{ inputs.force == true && '--force' || '' }}

      - name: Sanity check us.js
        run: python3 scripts/us_sanity.py

      # Only us/ and us.js are committed. The daily rebuild workflow commits data.js on its own
      # schedule, so pull --rebase before every push and retry: the two have raced before.
      - name: Commit if changed
        run: |
          git config user.name  "mygoldfund bot"
          git config user.email "actions@users.noreply.github.com"
          git add us us.js
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "us: $(date -u +%Y-%m-%dT%H:%M) run"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "could not push after 3 attempts"
          exit 1

      - name: Publish to gh-pages
        run: git push --force origin main:gh-pages

      # A silent failure is the dangerous one: the board would keep showing yesterday's
      # forecasts with no signal. Open an issue so it lands in email.
      - name: Raise an issue if the run broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "US board run failed";
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "automation"
            });
            const body = `The US board run failed on ${new Date().toISOString().slice(0,10)} ` +
              `(session input: ${{ inputs.session || 'auto' }}).\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `The site keeps serving the last good us.js and the ledger keeps its last rows. Usual causes: ` +
              `Yahoo blocking the runner (429), a source moving, or scripts/us_sanity.py rejecting the output. ` +
              `A missed session can be redone from the Actions tab with workflow_dispatch (session pre or post, force on).`;
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["automation"]
              });
            }
