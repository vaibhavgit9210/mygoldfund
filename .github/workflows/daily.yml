name: daily rebuild

on:
  schedule:
    # Twice, on purpose. GitHub delays or silently drops scheduled runs under load, and the
    # job is idempotent (rebuild, then commit only if something changed), so a second attempt
    # costs nothing and means one skipped run does not cost a day's update.
    - cron: "30 2 * * *"      # 08:00 IST, fresh before the morning look
    - cron: "30 8 * * *"      # 14:00 IST, safety net if the first was dropped
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "index.html", "app.js", "instruments.js", ".github/workflows/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install on purpose: build_data.py is stdlib only and every source is keyless.
      - name: Rebuild data
        run: python3 scripts/build_data.py

      - name: Sanity check the output
        run: python3 scripts/sanity_check.py

      - name: Commit if changed
        run: |
          git config user.name  "mygoldfund bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.js data.json; then
            echo "no change"
          else
            git add data.js data.json
            git commit -m "data: rebuild $(date -u +%Y-%m-%d)"
            git push origin main
          fi

      - name: Publish to gh-pages
        run: git push --force origin main:gh-pages

      # A silent failure is the dangerous one: the site would keep serving stale
      # numbers with no signal. Open an issue so it lands in email.
      - name: Raise an issue if the rebuild broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily rebuild failed";
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "automation"
            });
            const body = `The daily rebuild failed on ${new Date().toISOString().slice(0,10)}.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `The site keeps serving the last good data.js, and the page shows a staleness banner ` +
              `once the build is more than 2 days old. Usual causes: a data source moved or went down, ` +
              `or sanity_check.py rejected implausible values.`;
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["automation"]
              });
            }
